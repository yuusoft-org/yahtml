        ranges:
          tag:
            start: 0
            end: 7
          id: null
          classes: []
      tag: section
      selfClosing: false
      attributes:
        - name: role
          value: main
          kind: value
          source: object
        - name: hidden
          value: true
          kind: boolean
          source: object
      children:
        - type: element
          path:
            - 0
            - children
            - 0
          rawKey: p
          key:
            raw: p
            normalized: p
            tag: p
            id: ''
            classes: []
            attributes: []
            ranges:
              tag:
                start: 0
                end: 1
              id: null
              classes: []
          tag: p
          selfClosing: false
          attributes: []
          children:
            - type: text
              value: A
              path:
                - 0
                - children
                - 0
                - children
                - 0
---
case: merges selector and inline class attributes in ast attributes
in:
  - - div#home.card class="extra" data-id=1: null
out:
  type: root
  children:
    - type: element
      path:
        - 0
      rawKey: div#home.card class="extra" data-id=1
      key:
        raw: div#home.card class="extra" data-id=1
        normalized: div#home.card class="extra" data-id=1
        tag: div
        id: home
        classes:
          - card
        attributes:
          - name: class
            value: extra
            kind: value
            quote: '"'
            range:
              start: 14
              end: 27
            nameRange:
              start: 14
              end: 19
            valueRange:
              start: 21
              end: 26
            rawValueRange:
              start: 20
              end: 27
          - name: data-id
            value: '1'
            kind: value
            quote: null
            range:
              start: 28
              end: 37
            nameRange:
              start: 28
              end: 35
            valueRange:
              start: 36
              end: 37
            rawValueRange:
              start: 36
              end: 37
        ranges:
          tag:
            start: 0
            end: 3
          id:
            start: 4
            end: 8
          classes:
            - start: 9
              end: 13
      tag: div
      selfClosing: false
      attributes:
        - name: id
          value: home
          source: selector
        - name: class
          value: card extra
          source: selector+inline
        - name: data-id
          value: '1'
          kind: value
          source: inline
      children: []
---
case: inline id attribute overrides selector id in ast attributes
in:
  - - div#first id=second class="x": null
out:
  type: root
  children:
    - type: element
      path:
        - 0
      rawKey: div#first id=second class="x"
      key:
        raw: div#first id=second class="x"
        normalized: div#first id=second class="x"
        tag: div
        id: first
        classes: []
        attributes:
          - name: id
            value: second
            kind: value
            quote: null
            range:
              start: 10
              end: 19
            nameRange:
              start: 10
              end: 12
            valueRange:
              start: 13
              end: 19
            rawValueRange:
              start: 13
              end: 19
          - name: class
            value: x
            kind: value
            quote: '"'
            range:
              start: 20
              end: 29
            nameRange:
              start: 20
              end: 25
            valueRange:
              start: 27
              end: 28
            rawValueRange:
              start: 26
              end: 29
        ranges:
          tag:
            start: 0
            end: 3
          id:
            start: 4
            end: 9
          classes: []
      tag: div
      selfClosing: false
      attributes:
        - name: class
          value: x
          source: selector+inline
        - name: id
          value: second
          source: inline
      children: []
---
case: throws for malformed selector without tag
in:
  - - '#id-only.class-only: "content"'
throws: 'Malformed YAHTML element: "#id-only.class-only" - element must have a valid tag name'
---
case: throws for non-array root input
in:
  - div: x
throws: YAHTML content must be an array. YAHTML documents always start with an array at the root level.

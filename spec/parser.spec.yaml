      path:
        - 0
      rawKey: img src=photo.jpg
      key:
        raw: img src=photo.jpg
        normalized: img src=photo.jpg
        tag: img
        id: ''
        classes: []
        attributes:
          - name: src
            value: photo.jpg
            kind: value
            quote: null
            range:
              start: 4
              end: 17
            nameRange:
              start: 4
              end: 7
            valueRange:
              start: 8
              end: 17
            rawValueRange:
              start: 8
              end: 17
        ranges:
          tag:
            start: 0
            end: 3
          id: null
          classes: []
      tag: img
      selfClosing: true
      attributes:
        - name: src
          value: photo.jpg
          kind: value
          source: inline
      children: []
---

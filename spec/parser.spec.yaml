---
suite: parseYahtmlAst
exportName: parseYahtmlAst
---
case: builds text node root
in:
  - - plain text
out:
  type: root
  children:
    - type: text
      value: plain text
      path:
        - 0
---
case: builds element node from string declaration
in:
  - - 'h1: "Title"'
out:
  type: root
  children:
    - type: element
      path:
        - 0
      rawKey: h1
      key:
        raw: h1
        normalized: h1
        tag: h1
        id: ''
        classes: []
        attributes: []
        ranges:
          tag:
            start: 0
            end: 2
          id: null
          classes: []
      tag: h1
      selfClosing: false
      attributes: []
      children:
        - type: text
          value: Title
          path:
            - 0
            - children
            - 0
---
case: builds standalone raw html node
in:
  - - __html: <b>raw</b>
out:
  type: root
  children:
    - type: rawHtml
      value: <b>raw</b>
      path:
        - 0
---
case: builds doctype node
in:
  - - '!DOCTYPE': html5
out:
  type: root
  children:
    - type: doctype
      value: html
      path:
        - 0
      rawKey: '!DOCTYPE'
---
case: builds fragment node for nested root arrays
in:
  - - - 'span: "a"'
      - 'span: "b"'
out:
  type: root
  children:
    - type: fragment
      path:
        - 0
      children:
        - type: element
          path:
            - 0
            - 0
          rawKey: span
          key:
            raw: span
            normalized: span
            tag: span
            id: ''
            classes: []
            attributes: []
            ranges:
              tag:
                start: 0
                end: 4
              id: null
              classes: []
          tag: span
          selfClosing: false
          attributes: []
          children:
            - type: text
              value: a
              path:
                - 0
                - 0
                - children
                - 0
        - type: element
          path:
            - 0
            - 1
          rawKey: span
          key:
            raw: span
            normalized: span
            tag: span
            id: ''
            classes: []
            attributes: []
            ranges:
              tag:
                start: 0
                end: 4
              id: null
              classes: []
          tag: span
          selfClosing: false
          attributes: []
          children:
            - type: text
              value: b
              path:
                - 0
                - 1
                - children
                - 0
---
